name: Bug report
description: A tool gives a wrong result, fails, or the page breaks.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. English or French, as you prefer.
        **Never attach a real document.** A small synthetic PDF that shows the problem is enough.
        A security problem goes to a [private report](https://github.com/Snouzy/holy-pdf/security/advisories/new), not here.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - holy-pdf.com
        - Desktop app
        - Local build (pnpm dev or a fork)
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool
      placeholder: Merge, Compress, Sign…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, one step per line.
      placeholder: |
        1. Open Compress
        2. Drop a 12-page scanned PDF
        3. Choose "Strong"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Safari 26 on macOS 26, Chrome 154 on Android 16…
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Your files
      options:
        - label: I attach no real or personal document, only a synthetic file if one is needed.
          required: true
