[package]
name = "holy-pdf"
version = "0.1.0"
description = "Holy PDF desktop shell: the site's PDF tools in a Tauri window"
authors = ["Snouzylabs S.R.L."]
license-file = "../../../LICENSING.md"
publish = false
repository = "https://github.com/Snouzy/holy-pdf"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["rlib"]

# Unbundled, as under `tauri dev`, macOS names the app in the Dock after its executable file; Cargo refuses a space.
[[bin]]
name = "HolyPDF"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sys-locale = "0.3"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-window-state = "2.5.0"
